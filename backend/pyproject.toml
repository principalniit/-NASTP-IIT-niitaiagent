[project]
name = "niit-seo-agent-backend"
version = "0.1.0"
description = "NIIT AI SEO Agent API and worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx>=0.27,<0.29",  # crawler transport relies on AsyncHTTPTransport internals
    "selectolax>=0.3.21",
    "lxml>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is prose; wrapping it mid-sentence makes prompts harder to review.
"app/modules/ai/tasks.py" = ["E501"]
"app/modules/ai/agent.py" = ["E501"]
"app/modules/ai/runner.py" = ["E501"]
"tests/**" = ["S101", "S104", "S105", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
